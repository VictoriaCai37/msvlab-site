backend:
  name: github
  repo: VictoriaCai37/msvlab-site
  branch: main
  base_url: https://round-hat-afdc.victoriacai2026.workers.dev
  auth_endpoint: auth
  auth_scope: repo

locale: 'zh'

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "reviews"
    label: "评测文章"
    folder: "src/content/reviews"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "标题", name: "title", widget: "string", required: true}
      - {label: "摘要", name: "excerpt", widget: "text", required: true}
      - {label: "主图", name: "heroImage", widget: "image", required: true}
      - {label: "主图 Alt", name: "heroAlt", widget: "string", required: true}
      - {label: "主图位置", name: "heroPosition", widget: "select", required: false, options: ["top", "center", "bottom"], default: "center"}
      # 🌟 图库恢复成标准的图片列表组件 🌟
      - label: "图库 (可选)"
        name: "images"
        widget: "list"
        required: false
        fields:
          - {label: "图片", name: "src", widget: "image", required: true}
          - {label: "Alt 文字", name: "alt", widget: "string", required: true}
      - {label: "分类", name: "category", widget: "select", required: true, options: ["smart-living", "home-bath", "audio-entertainment"]}
      # 🌟 标签和优缺点保持纯文本列表，防止报错点不动Publish 🌟
      - {label: "标签 (可选)", name: "tags", widget: "list", required: false}
      - {label: "发布日期", name: "publishDate", widget: "datetime", required: true, format: "YYYY-MM-DD"}
      - {label: "阅读时间", name: "readTime", widget: "string", required: true}
      - {label: "评分 (1-5)", name: "rating", widget: "number", required: true}
      - {label: "优点 (可选)", name: "pros", widget: "list", required: false}
      - {label: "缺点 (可选)", name: "cons", widget: "list", required: false}
      - {label: "适用人群 (可选)", name: "whoShouldBuy", widget: "list", required: false}
      - {label: "结论", name: "verdict", widget: "text", required: true}
      - {label: "价格 (可选)", name: "price", widget: "number", required: false}
      - {label: "联盟链接 (可选)", name: "affiliateUrl", widget: "string", required: false}
      - {label: "推荐", name: "featured", widget: "boolean", required: false, default: false}
      - {label: "草稿", name: "draft", widget: "boolean", required: false, default: false}
      - {label: "正文", name: "body", widget: "markdown", required: true}

  - name: "best-products"
    label: "精选推荐"
    folder: "src/content/best-products"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "标题", name: "title", widget: "string", required: true}
      - {label: "摘要", name: "excerpt", widget: "text", required: true}
      - {label: "主图", name: "heroImage", widget: "image", required: true}
      - {label: "主图 Alt", name: "heroAlt", widget: "string", required: true}
      - {label: "主图位置", name: "heroPosition", widget: "select", required: false, options: ["top", "center", "bottom"], default: "center"}
      - {label: "分类", name: "category", widget: "select", required: true, options: ["smart-living", "home-bath", "audio-entertainment"]}
      - {label: "发布日期", name: "publishDate", widget: "datetime", required: true, format: "YYYY-MM-DD"}
      - {label: "产品列表", name: "products", widget: "list", required: true, fields:
        [
          {label: "排名", name: "rank", widget: "number", required: true},
          {label: "产品名", name: "name", widget: "string", required: true},
          {label: "图片", name: "image", widget: "image", required: true},
          {label: "评分", name: "rating", widget: "number", required: true},
          {label: "优点", name: "pros", widget: "string", required: true},
          {label: "缺点", name: "cons", widget: "string", required: true},
          {label: "适用场景", name: "bestFor", widget: "string", required: true},
          {label: "价格", name: "price", widget: "number", required: true},
          {label: "联盟链接", name: "affiliateUrl", widget: "string", required: true}
        ]}
      - {label: "推荐", name: "featured", widget: "boolean", required: false, default: false}
      - {label: "草稿", name: "draft", widget: "boolean", required: false, default: false}
      - {label: "正文", name: "body", widget: "markdown", required: true}

  - name: "deals"
    label: "优惠信息"
    folder: "src/content/deals"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "标题", name: "title", widget: "string", required: true}
      - {label: "摘要", name: "excerpt", widget: "text", required: true}
      - {label: "主图", name: "heroImage", widget: "image", required: true}
      - {label: "主图 Alt", name: "heroAlt", widget: "string", required: true}
      - {label: "产品名", name: "productName", widget: "string", required: true}
      - {label: "原价", name: "originalPrice", widget: "number", required: true}
      - {label: "现价", name: "salePrice", widget: "number", required: true}
      - {label: "折扣百分比", name: "discountPercent", widget: "number", required: true}
      - {label: "分类", name: "category", widget: "select", required: true, options: ["smart-living", "home-bath", "audio-entertainment"]}
      - {label: "商家", name: "merchant", widget: "string", required: true}
      - {label: "联盟链接", name: "affiliateUrl", widget: "string", required: true}
      - {label: "发布日期", name: "publishDate", widget: "datetime", required: true, format: "YYYY-MM-DD"}
      - {label: "推荐", name: "featured", widget: "boolean", required: false, default: false}
      - {label: "草稿", name: "draft", widget: "boolean", required: false, default: false}
      - {label: "正文", name: "body", widget: "markdown", required: true}

site_url: https://msvlab.site
display_url: https://msvlab.site
logo_url: /favicon.svg
