<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Ms V Lab — CMS</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <!-- 关键：添加 defer 属性，确保 DOM 加载完成后再执行 -->
  <script defer src="https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    .cms-loading { display: flex; align-items: center; justify-content: center; height: 100vh; background: #fafafa; }
  </style>
</head>
<body>
  <!-- 关键：提供挂载点 -->
  <div id="nc-root">
    <div class="cms-loading">Loading CMS…</div>
  </div>
</body>
</html>
